<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- YellowDocs Writer Application Icon -->
<!-- Original design for YellowDocs Writer -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- YellowDocs accent color: Golden yellow (#FFBF00) -->
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBF00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="shadow" x="-2" y="-2" width="104" height="104">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="url(#yellowGradient)" filter="url(#shadow)"/>
  
  <!-- Document symbol (white) -->
  <g fill="white">
    <!-- Document body -->
    <rect x="18" y="20" width="28" height="36" rx="2" ry="2" fill="white"/>
    
    <!-- Document lines -->
    <line x1="20" y1="26" x2="44" y2="26" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="30" x2="40" y2="30" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="34" x2="44" y2="34" stroke="#333" stroke-width="1"/>
    
    <!-- Document top fold -->
    <path d="M20,20 L44,20 L42,16 L30,16 L28,20 Z" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  </g>
  
  <!-- Yellow accent on document -->
  <rect x="22" y="22" width="6" height="6" fill="#FFBF00" rx="1" ry="1"/>
</svg>
