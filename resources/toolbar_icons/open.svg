<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Open Document Toolbar Icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBF00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Folder with document -->
  <path d="M3,5 L10,5 L12,3 L21,3 L21,10 L3,10 Z" fill="none" stroke="#333" stroke-width="1.2"/>
  
  <!-- Folder tab -->
  <path d="M12,3 L12,5 L21,5" fill="none" stroke="#333" stroke-width="1.2"/>
  
  <!-- Document inside folder -->
  <rect x="6" y="7" width="12" height="14" rx="1" ry="1" fill="none" stroke="#333" stroke-width="1.2"/>
  
  <!-- Document lines -->
  <line x1="8" y1="10" x2="16" y2="10" stroke="#666" stroke-width="0.8"/>
  <line x1="8" y1="13" x2="14" y2="13" stroke="#666" stroke-width="0.8"/>
  <line x1="8" y1="16" x2="16" y2="16" stroke="#666" stroke-width="0.8"/>
  
  <!-- Yellow accent -->
  <circle cx="18" cy="18" r="2" fill="url(#yellowGradient)"/>
  
  <!-- Document top fold -->
  <path d="M6,7 L18,7 L17,5 L7,5 L6,7 Z" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
</svg>
