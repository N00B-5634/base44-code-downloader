<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Bold Toolbar Icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBF00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bold letter B -->
  <g fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6,4 L6,20"/>
    <path d="M6,4 C6,4 8,6 10,6 C12,6 14,4 14,4 L14,12 C14,12 12,14 10,14 C8,14 6,12 6,12 Z"/>
    <path d="M10,14 C10,14 12,16 14,16 C16,16 18,14 18,14 L18,20"/>
    <path d="M14,10 C14,10 16,12 18,12"/>
  </g>
  
  <!-- Yellow accent -->
  <path d="M6,4 L14,4 L14,10 L6,10 Z" fill="url(#yellowGradient)" opacity="0.3"/>
</svg>
