<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Center Align Toolbar Icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBF00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Alignment lines -->
  <g stroke="#333" stroke-width="1.5" stroke-linecap="round">
    <line x1="4" y1="6" x2="4" y2="18"/>
    <line x1="8" y1="6" x2="8" y2="18"/>
    <line x1="12" y1="6" x2="12" y2="18"/>
    <line x1="16" y1="6" x2="16" y2="18"/>
    <line x1="20" y1="6" x2="20" y2="18"/>
  </g>
  
  <!-- Yellow accent on center lines -->
  <g stroke="url(#yellowGradient)" stroke-width="2" stroke-linecap="round">
    <line x1="8" y1="8" x2="8" y2="16"/>
    <line x1="12" y1="10" x2="12" y2="14"/>
    <line x1="16" y1="8" x2="16" y2="16"/>
  </g>
</svg>
