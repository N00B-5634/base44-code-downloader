<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- New Document Toolbar Icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBF00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Document with plus sign -->
  <rect x="4" y="3" width="16" height="20" rx="1" ry="1" fill="none" stroke="#333" stroke-width="1.2"/>
  
  <!-- Document lines -->
  <line x1="6" y1="8" x2="18" y2="8" stroke="#666" stroke-width="0.8"/>
  <line x1="6" y1="12" x2="16" y2="12" stroke="#666" stroke-width="0.8"/>
  <line x1="6" y1="16" x2="18" y2="16" stroke="#666" stroke-width="0.8"/>
  
  <!-- Plus sign in yellow -->
  <g fill="url(#yellowGradient)">
    <rect x="10" y="10" width="4" height="2" rx="0.5" ry="0.5"/>
    <rect x="12" y="8" width="2" height="4" rx="0.5" ry="0.5"/>
  </g>
  
  <!-- Document top fold -->
  <path d="M6,3 L18,3 L17,1 L7,1 L6,3 Z" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
</svg>
