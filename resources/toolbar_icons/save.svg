<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Save Document Toolbar Icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBF00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Floppy disk -->
  <rect x="4" y="4" width="16" height="16" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.2"/>
  
  <!-- Disk label area -->
  <rect x="6" y="6" width="12" height="10" rx="1" ry="1" fill="#f0f0f0"/>
  
  <!-- Disk hole -->
  <circle cx="10" cy="10" r="1.5" fill="#333"/>
  
  <!-- Write protect notch -->
  <rect x="16" y="8" width="2" height="4" fill="#333" rx="0.5" ry="0.5"/>
  
  <!-- Yellow accent on disk -->
  <rect x="7" y="7" width="4" height="4" fill="url(#yellowGradient)" rx="0.5" ry="0.5"/>
  
  <!-- Disk shadow -->
  <path d="M4,20 L20,20 L20,22 L4,22 Z" fill="#ccc" opacity="0.3"/>
</svg>
